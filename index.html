<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y&amp;Y Plastic · Catálogo</title>
  <meta name="description" content="Y&Y Plastic — Soluciones prácticas para tu cocina. Catálogo de envases, desechables y artículos plásticos al detalle y al mayor.">
  <meta name="theme-color" content="#44A57F">
  <link rel="icon" type="image/svg+xml" href="assets/isotipo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pedidos.css">
</head>
<body>
  <!-- ===== Encabezado ===== -->
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a href="./" class="brand" aria-label="Inicio">
        <img src="assets/logo-horizontal.svg" alt="Y&Y Plastic" class="brand__logo">
      </a>
      <div class="price-toggle" role="group" aria-label="Tipo de precio">
        <button type="button" data-modo="detalle" class="is-active">Al detalle</button>
        <button type="button" data-modo="mayor">Al mayor</button>
      </div>
      <button type="button" class="cart-btn" id="btnCarrito" aria-label="Ver carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4H21l-2.2 9.1a2 2 0 0 1-2 1.5H8.4l.4 2H19v2H7.2L4.4 4.6 3.3 2H1V0h3.6l.6 1.4L5.2 4Zm.7 2 1.9 6.6h9l1.6-6.6H5.9Z"/></svg>
        <span class="cart-btn__count" id="carritoCount" hidden>0</span>
      </button>
    </div>
  </header>

  <main>
    <!-- ===== Carrusel ===== -->
    <section class="hero" id="hero" aria-roledescription="carrusel">
      <div class="hero__track" id="heroTrack"></div>
      <button class="hero__nav hero__nav--prev" id="heroPrev" aria-label="Anterior">&#8249;</button>
      <button class="hero__nav hero__nav--next" id="heroNext" aria-label="Siguiente">&#8250;</button>
      <div class="hero__dots" id="heroDots"></div>
      <button class="admin-only hero__edit btn btn--small" id="btnEditCarrusel">Editar carrusel</button>
    </section>

    <!-- ===== Catálogo ===== -->
    <section class="wrap catalog" id="catalogo">
      <div class="catalog__head">
        <div>
          <h1 class="catalog__title">Catálogo</h1>
          <p class="catalog__note" id="notaPrecio"></p>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.3-1.4 1.4-4.3-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
          <input type="search" id="buscar" placeholder="Buscar producto o código…" autocomplete="off">
        </div>
      </div>

      <div class="chips" id="chips" role="tablist" aria-label="Categorías"></div>

      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="empty" id="empty" hidden>No encontramos productos con ese filtro.</p>
      <div class="more">
        <button class="btn btn--ghost" id="btnMas" hidden>Ver más productos</button>
      </div>
    </section>
  </main>

  <!-- ===== Pie ===== -->
  <footer class="footer">
    <div class="wrap footer__inner">
      <div class="footer__brand">
        <img src="assets/logo.svg" alt="Y&Y Plastic" class="footer__logo">
        <p id="footerEslogan" class="footer__slogan"></p>
      </div>
      <div class="footer__info" id="footerInfo"></div>
    </div>
    <div class="footer__bottom">
      <div class="wrap footer__bottom-inner">
        <span>© <span id="anio"></span> Y&amp;Y Plastic · Distribuidora Fénix SpA</span>
        <button class="footer__admin" id="btnAdmin" type="button" aria-label="Acceso administrador" title="Administrador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H9V7Zm3 7a2 2 0 0 1 1 3.7V19h-2v-1.3a2 2 0 0 1 1-3.7Z"/></svg>
        </button>
      </div>
    </div>
    <div class="footer__credit">
      Página realizada por <strong>Spotgo Tecnología SpA</strong>
    </div>
  </footer>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" hidden aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.9 1 3.9.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4Z"/></svg>
  </a>

  <!-- ===== Barra de administración ===== -->
  <div class="adminbar admin-only" id="adminbar">
    <span class="adminbar__tag">Modo admin</span>
    <button class="btn btn--small btn--orders" data-admin="pedidos">Pedidos <span class="orders-badge" id="pedidosBadge" hidden>0</span></button>
    <button class="btn btn--small" data-admin="nuevo">+ Producto</button>
    <button class="btn btn--small btn--light" data-admin="categorias">Categorías</button>
    <button class="btn btn--small btn--light" data-admin="carrusel">Carrusel</button>
    <button class="btn btn--small btn--light" data-admin="ajustes">Datos del negocio</button>
    <button class="btn btn--small btn--light" data-admin="clave">Cambiar clave</button>
    <button class="btn btn--small btn--dark" data-admin="salir">Salir</button>
  </div>

  <!-- ===== Modal genérico ===== -->
  <dialog class="modal" id="modal">
    <div class="modal__box">
      <button class="modal__close" id="modalClose" aria-label="Cerrar">&times;</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/imagenes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pedidos-admin.js"></script>
</body>
</html>
